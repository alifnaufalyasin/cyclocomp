name: Release APK

# Publishes a signed APK as a GitHub Release when a version tag such as v0.2.0 is pushed.
# The app's in-app updater looks for the newest release. See RELEASE.md for the one-time setup
# (signing key as repository secrets). Without the secrets this workflow stops with a clear message.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets are configured
        id: check
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Release signing secrets are not configured. See RELEASE.md."
            exit 1
          fi

      - name: Work out the version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-v0.0.0}"
          V="${TAG#v}"
          IFS=. read -r MAJ MIN PAT <<< "${V%%-*}"
          if ! [[ "$MAJ" =~ ^[0-9]+$ && "$MIN" =~ ^[0-9]+$ && "$PAT" =~ ^[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "name=$MAJ.$MIN.$PAT" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJ * 1000000 + MIN * 1000 + PAT))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install required SDK platform/build-tools
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          chmod 600 "$RUNNER_TEMP/release-keystore.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Name the APK and write its checksum
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          OUT="cyclocomp-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "${{ github.ref_name }}" --generate-notes

      - name: Keep the APK as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
